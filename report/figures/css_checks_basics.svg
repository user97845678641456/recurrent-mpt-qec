    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; fill: #287f75" transform="translate(143.7 220.310578)">两组稳定子彼此对易，可以共同定义编码子空间</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #233647" x="259.2" y="247.658681" transform="rotate(-0 259.2 247.658681)">syndrome 是校验结果（+1 / −1 的二进制编码），不直接测出逻辑量子态。</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #233647" x="259.2" y="266.309556" transform="rotate(-0 259.2 266.309556)">满足全部校验仍可能存在逻辑错误：恢复后还要检查逻辑作用。</text>
   </g>
