   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #233647" x="259.2" y="23.855278" transform="rotate(-0 259.2 23.855278)">02  单帧 MPT 细节：一层中的两次交叉注意力</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #233647" x="259.2" y="45.422897" transform="rotate(-0 259.2 45.422897)">先更新隐变量 V，再用更新后的 V 更新隐变量 C</text>
   </g>
   <g id="text_3">
    <!-- $V$ -->
    <g style="fill: #236b9b" transform="translate(48.2048 106.24305)">
     <text>
      <tspan x="0" y="-0.546875" style="font-style: italic; font-size: 16px; font-family: 'STIXGeneral'; fill: #236b9b">V</tspan>
     </text>
    </g>
   </g>
   <g id="text_4">
    <!-- $C$ -->
    <g style="fill: #236b9b" transform="translate(47.8048 212.68785)">
     <text>
      <tspan x="0" y="-0.34375" style="font-style: italic; font-size: 16px; font-family: 'STIXGeneral'; fill: #236b9b">C</tspan>
     </text>
    </g>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #236b9b" transform="translate(163.1796 89.528011)">掩码交叉注意力</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #236b9b" transform="translate(168.023545 104.728402)">Q 来自 LN(V)</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #236b9b" transform="translate(160.571006 119.928792)">K、Value 来自 C</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #236b9b" transform="translate(322.872 89.528011)">残差相加</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #236b9b" transform="translate(318.706453 104.728402)">LN → FFN</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #236b9b" transform="translate(312.372 119.928792)">再做残差相加</text>
   </g>
   <g id="text_7">
    <!-- $V^{+}$ -->
    <g style="fill: #236b9b" transform="translate(455.2352 106.24305)">
     <text>
      <tspan x="0" y="-0.225" style="font-style: italic; font-size: 16px; font-family: 'STIXGeneral'; fill: #236b9b">V</tspan>
      <tspan x="11.476782" y="-5.875" style="font-size: 11.2px; font-family: 'STIXGeneral'; fill: #236b9b">+</tspan>
     </text>
    </g>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #236b9b" transform="translate(163.1796 195.972811)">掩码交叉注意力</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #236b9b" transform="translate(168.0621 211.173202)">Q 来自 LN(C)</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #236b9b" transform="translate(150.032452 226.373592)">K、Value 来自新的 V</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #236b9b" transform="translate(322.872 195.972811)">残差相加</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #236b9b" transform="translate(318.706453 211.173202)">LN → FFN</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #236b9b" transform="translate(312.372 226.373592)">再做残差相加</text>
   </g>
   <g id="text_10">
    <!-- $C^{+}$ -->
    <g style="fill: #236b9b" transform="translate(454.8352 212.68785)">
     <text>
      <tspan x="0" y="-0.225" style="font-style: italic; font-size: 16px; font-family: 'STIXGeneral'; fill: #236b9b">C</tspan>
      <tspan x="12.415435" y="-5.875" style="font-size: 11.2px; font-family: 'STIXGeneral'; fill: #236b9b">+</tspan>
     </text>
    </g>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #287f75" x="321.2928" y="150.209906" transform="rotate(-0 321.2928 150.209906)">更新后的隐变量 V</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #233647" x="259.2" y="256.654706" transform="rotate(-0 259.2 256.654706)">Q、K、Value 分别经过线性投影；4 头注意力，隐变量维度为 64。</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #233647" x="259.2" y="278.79795" transform="rotate(-0 259.2 278.79795)">同一层的两个方向复用参数；每帧执行两层，第 1 层后及第 2 层后均做 LayerNorm。</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #657581" x="259.2" y="300.939358" transform="rotate(-0 259.2 300.939358)">掩码固定取自校验矩阵；当前帧嵌入与 p 条件在进入 MPT 前注入隐变量。</text>
   </g>
  </g>
 </g>
