   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #233647" x="259.2" y="24.813297" transform="rotate(-0 259.2 24.813297)">03  从隐变量到故障 logits：以第 i 个故障为例</text>
   </g>
   <g id="text_2">
    <!-- $C_0,C_1,\ldots,C_{12}$ -->
    <g style="fill: #236b9b" transform="translate(58.3208 59.164078)">
