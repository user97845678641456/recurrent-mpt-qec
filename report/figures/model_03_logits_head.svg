   <g id="text_4">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #236b9b" x="422.8992" y="58.613297" transform="rotate(-0 422.8992 58.613297)">故障 i 的其他输入</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #287f75" transform="translate(49.11705 106.865611)">Linear（64 → 16）</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #287f75" transform="translate(38.496464 122.066002)">按故障 i 关联的位置平均</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #287f75" transform="translate(70.486191 137.266392)">得到 16 维</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #287f75" transform="translate(203.334258 106.865611)">V、C 分别求均值后拼接</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #287f75" transform="translate(209.737617 122.066002)">Linear（128 → 16）</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #287f75" transform="translate(234.185391 137.266392)">得到 16 维</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #287f75" transform="translate(383.688263 106.551021)">故障嵌入：16 维</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #287f75" transform="translate(376.266895 121.751412)">检测事件计数：1 维</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #287f75" transform="translate(372.760059 137.520279)">先验 logit / 10：1 维</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #236b9b" x="259.2" y="195.746287" transform="rotate(-0 259.2 195.746287)">拼接：16 + 16 + 16 + 1 + 1 = 50 维</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; fill: #236b9b" transform="translate(135.397578 245.30533)">Linear（50 → 32）→ GELU → Linear（32 → 1）</text>
